# Sweep recipe: Domain Randomization for Sim-to-Real Transfer
# Tests which randomization ranges work best for PlugCharger-v1.
# Based on Aljalbout et al. 2026 — domain randomization is the
# highest-impact, lowest-effort sim-to-real technique.
#
# Usage:
#   PYTHONPATH=. .venv/bin/python experiments/diffusion_wm/run_transfer.py --task PlugCharger-v1
#
# Sweep matrix (run each config separately or via autoresearch):
task: sim_to_real_domain_rand
env_id: PlugCharger-v1
obs: state
description: >
  Domain randomization sweep for sim-to-real transfer on PlugCharger-v1.
  Tests friction/mass/damping ranges and observation noise levels.
  Run with --no-wandb to skip logging.

configs:
  # Conservative: tight ranges, low noise
  conservative:
    friction: [0.8, 1.2]
    mass: [0.9, 1.1]
    damping: [0.8, 1.2]
    stiffness: [0.9, 1.1]
    position_noise: 0.005
    velocity_noise: 0.01
    description: "Conservative DR — tight physics, minimal observation noise"

  # Moderate: default ManiSkill ranges
  moderate:
    friction: [0.5, 2.0]
    mass: [0.8, 1.2]
    damping: [0.5, 1.5]
    stiffness: [0.8, 1.2]
    position_noise: 0.01
    velocity_noise: 0.02
    description: "Moderate DR — standard ManiSkill3 ranges"

  # Aggressive: wide ranges, high noise
  aggressive:
    friction: [0.3, 3.0]
    mass: [0.5, 1.5]
    damping: [0.3, 2.0]
    stiffness: [0.5, 1.5]
    position_noise: 0.02
    velocity_noise: 0.05
    description: "Aggressive DR — wide physics variation, strong noise"

  # Contact-focused: emphasis on contact dynamics
  contact_focused:
    friction: [0.2, 3.0]
    mass: [0.7, 1.3]
    damping: [0.4, 1.6]
    stiffness: [0.5, 1.5]
    contact_stiffness: [0.2, 5.0]
    contact_damping: [0.2, 5.0]
    position_noise: 0.01
    velocity_noise: 0.03
    description: "Contact-focused DR — wide contact parameter ranges"

  # Noise-only: no physics randomization, only observation/action noise
  noise_only:
    friction: [1.0, 1.0]
    mass: [1.0, 1.0]
    damping: [1.0, 1.0]
    stiffness: [1.0, 1.0]
    position_noise: 0.03
    velocity_noise: 0.05
    orientation_noise: 0.02
    description: "Noise-only DR — no physics variation, pure observation noise"

  # Physics-only: no observation noise, only physics randomization
  physics_only:
    friction: [0.3, 3.0]
    mass: [0.5, 1.5]
    damping: [0.3, 2.0]
    stiffness: [0.5, 1.5]
    position_noise: 0.0
    velocity_noise: 0.0
    description: "Physics-only DR — wide physics variation, no observation noise"

transfer:
  sysid_iterations: 100
  sysid_lr: 0.001
  residual_hidden_dim: 256
  residual_weight: 1.0
  online_lr: 0.0001
  online_buffer_size: 1000
  divergence_threshold: 0.1
