# Self-Driving Learning Loop — 5-task × 5-round sweep config
# Usage: python -m experiments.diffusion_wm.loop --task <task> --num-rounds 5

common_overrides: |
  module: experiments.diffusion_wm.loop
  num_rounds: 5
  episodes_per_round: 100
  train_steps_per_round: 10000
  hidden_dim: 512
  num_blocks: 6
  diffusion_timesteps: 1000
  inference_steps: 100
  trust_threshold: 0.7
  reward_threshold: 0.5

iters:
  # ---- PlugCharger-v1 (precision insertion) ----
  - name: plugcharger_r1
    overrides: |
      task: PlugCharger-v1
      round: 1
    seeds: [42]
  - name: plugcharger_r2
    overrides: |
      task: PlugCharger-v1
      round: 2
    seeds: [42]
